<style>
  /* ---- Typography: Archivo, self-hosted (SIL Open Font License) ---- */
  @font-face {
    font-family: 'Archivo';
    font-style: normal;
    font-weight: 600;
    font-display: swap;
    src: url('/fonts/archivo-latin-600-normal.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Archivo';
    font-style: normal;
    font-weight: 800;
    font-display: swap;
    src: url('/fonts/archivo-latin-800-normal.woff2') format('woff2');
  }

  /* ---- Brand tokens (see design manual) ---- */
  :root {
    --bg:            #0A1424;
    --bg-deep:       #02060D;
    --bg-raised:     #131C2E;
    --text:          #EAF2FB;
    --text-muted:    #8FA6C4;
    --text-subtle:   #5D82B8;
    --orange:        #F97316;
    --orange-deep:   #EA6A0B;
    --orange-light:  #FFB35C;
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: clamp(1.5rem, 6vw, 4rem);
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 70% 55% at 50% 8%, rgba(249, 115, 22, 0.13), transparent 70%),
      radial-gradient(ellipse 90% 70% at 50% 100%, rgba(19, 28, 46, 0.9), transparent 70%);
    color: var(--text);
    font-family: 'Archivo', Arial, sans-serif;
    font-weight: 600;
    line-height: 1.6;
    text-align: center;
  }

  main {
    width: 100%;
    max-width: 44rem;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ---- Lockup: the ready-made dark lockup, inlined so the webfont applies ---- */
  .lockup {
    width: min(38rem, 90vw);
    min-width: 15rem;   /* design manual: never below 240px wide */
    height: auto;
    display: block;
  }

  /* ---- Coming soon ---- */
  .status {
    margin-top: clamp(2rem, 6vw, 3rem);
    display: inline-flex;
    align-items: center;
    gap: .625rem;
    padding: .45rem 1.1rem .45rem .9rem;
    border: 1px solid rgba(249, 115, 22, 0.35);
    border-radius: 999px;
    background: rgba(249, 115, 22, 0.09);
    color: var(--orange-light);
    font-size: .8125rem;
    font-weight: 600;
    letter-spacing: .16em;
    text-transform: uppercase;
  }

  .status .dot {
    width: .5rem;
    height: .5rem;
    border-radius: 50%;
    background: var(--orange);
    box-shadow: 0 0 0 0 rgba(249, 115, 22, 0.6);
    animation: pulse 2.4s ease-out infinite;
  }

  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0.55); }
    70%  { box-shadow: 0 0 0 .55rem rgba(249, 115, 22, 0); }
    100% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .status .dot { animation: none; }
  }

  .lead {
    margin: 1.5rem 0 0;
    max-width: 32rem;
    font-size: clamp(1rem, 2.4vw, 1.1875rem);
    color: var(--text-muted);
  }

  /* ---- GitHub call to action ---- */
  .cta {
    margin-top: clamp(2rem, 5vw, 2.75rem);
    display: inline-flex;
    align-items: center;
    gap: .625rem;
    padding: .8rem 1.5rem;
    border-radius: .625rem;
    background: linear-gradient(180deg, var(--orange-light), var(--orange) 55%, var(--orange-deep));
    color: #2A1200;
    font-size: 1rem;
    font-weight: 800;
    text-decoration: none;
    box-shadow: 0 6px 18px rgba(2, 6, 13, 0.45);
    transition: transform .15s ease, box-shadow .15s ease, filter .15s ease;
  }

  .cta:hover,
  .cta:focus-visible {
    transform: translateY(-1px);
    filter: brightness(1.06);
    box-shadow: 0 10px 24px rgba(2, 6, 13, 0.55);
  }

  .cta:active { transform: translateY(0); }

  .cta svg { width: 1.25rem; height: 1.25rem; flex: none; }

  :focus-visible {
    outline: 2px solid var(--orange-light);
    outline-offset: 3px;
  }

  footer {
    margin-top: clamp(3rem, 8vw, 4.5rem);
    font-size: .8125rem;
    color: var(--text-subtle);
  }

  footer a { color: inherit; text-decoration: none; border-bottom: 1px solid rgba(93, 130, 184, 0.35); }
  footer a:hover { color: var(--text-muted); }
</style>
</head>
<body>
<main>

  <!-- Tandem Commander lockup, dark background variant. Do not recolour or rebuild. -->
  <svg class="lockup" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" role="img"

    <defs>

    <g transform="translate(20,28) scale(0.5625)">

          <g transform="rotate(4 128 110)"><rect x="84" y="72" width="96" height="60" rx="9" fill="#EAF2FB"/></g>

        </g>
        <rect x="50" y="104" width="156" height="44" rx="22" fill="url(#tc-gloss)"/>

        <rect x="50" y="104" width="156" height="88" rx="22" fill="url(#tc-innerBottom)"/>
        <rect x="66" y="122" width="58" height="54" rx="9" fill="#FFFFFF" opacity="0.22"/>
        <rect x="132" y="122" width="58" height="54" rx="9" fill="#FFFFFF" opacity="0.22"/>
        <rect x="74" y="130" width="40" height="6" rx="3" fill="#FFE3C2" opacity="0.85"/>
        <rect x="74" y="143" width="30" height="6" rx="3" fill="#FFE3C2" opacity="0.85"/>
        <rect x="74" y="156" width="42" height="6" rx="3" fill="#FFE3C2" opacity="0.85"/>
        <rect x="140" y="130" width="40" height="6" rx="3" fill="#FFE3C2" opacity="0.85"/>
        <rect x="140" y="143" width="30" height="6" rx="3" fill="#FFE3C2" opacity="0.85"/>
        <rect x="140" y="156" width="42" height="6" rx="3" fill="#FFE3C2" opacity="0.85"/>
      </g>
    </g>
    <text x="200" y="105" font-family="Archivo, Arial, sans-serif" font-weight="800" font-size="64" letter-spacing="-1.5"><tspan fill="#EAF2FB">Tandem </tspan><tspan fill="#F97316">Commander</tspan></text>
    <text x="203" y="145" font-family="Archivo, Arial, sans-serif" font-weight="600" font-size="19" letter-spacing="9" fill="#8FA6C4">TWO-PANE FILE MANAGER</text>
  </svg>

  <p class="status"><span class="dot" aria-hidden="true"></span>Coming soon</p>

  <p class="lead">
    An open source two-pane file manager, currently in development.
    Follow the repository to watch it take shape.
  </p>

  <a class="cta" href="https://github.com/tandemcommander/tandemcommander" rel="noopener">

  <footer>

  </footer>

</main>
